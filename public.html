<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Live Order Queue</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--panel2:#1d212b;--line:#272c38;--text:#e8ebf2;
    --muted:#8b93a7;--pri:#ffb020;--pri-bg:#3a2c0c;--done:#25c26e;--hi:#4f8cff}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
  header{position:sticky;top:0;background:linear-gradient(180deg,#141824,#0f1115);
    border-bottom:1px solid var(--line);padding:16px 20px;text-align:center}
  header h1{font-size:18px;margin:0}
  header .sub{font-size:12px;color:var(--muted);margin-top:4px}
  .dot{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block;margin-right:6px}
  .dot.live{background:var(--done);box-shadow:0 0 8px var(--done)}
  main{max-width:560px;margin:0 auto;padding:16px 14px 80px}
  .find{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:16px}
  .row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);
    border-radius:11px;padding:12px 14px;margin-bottom:8px;animation:pop .18s ease}
  @keyframes pop{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
  .row.priority{border-color:var(--pri);background:linear-gradient(90deg,var(--pri-bg),var(--panel))}
  .row.me{outline:2px solid var(--hi);box-shadow:0 0 14px rgba(79,140,255,.35)}
  .pos{font-variant-numeric:tabular-nums;font-weight:800;font-size:20px;width:40px;text-align:center;color:var(--muted)}
  .row.priority .pos{color:var(--pri)}
  .name{font-weight:700;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:var(--pri);color:#2a1e00}
  .count{margin-left:auto;font-size:12px;color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:12px}
  .note{font-size:11px;color:var(--muted);text-align:center;margin-top:18px}
</style>
</head>
<body>
<header>
  <h1><span id="dot" class="dot"></span>Live Order Queue</h1>
  <div class="sub" id="sub">Waiting for the live to start…</div>
</header>
<main>
  <input id="find" class="find" placeholder="Type your username to highlight your spot…" oninput="render()" />
  <div id="list"></div>
  <div class="note">Order totals and personal details are private and never shown here.</div>
</main>
<script>
  const socket = io('/public');
  let state = { queue: [], stats: {} };
  socket.on('connect', () => document.getElementById('dot').classList.add('live'));
  socket.on('disconnect', () => document.getElementById('dot').classList.remove('live'));
  socket.on('state', (s) => { state = s; render(); });

  function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

  function render(){
    const q = state.queue || [];
    const st = state.stats || {};
    const live = state.live !== false; // treat missing as live for safety
    const findBox = document.getElementById('find');
    const el = document.getElementById('list');

    if(!live){
      document.getElementById('sub').textContent = 'Offline — no live running right now';
      findBox.style.display = 'none';
      el.innerHTML = '<div class="empty">🔴 The live isn\'t running right now, so the queue is closed.<br><br>Check back during the next live!</div>';
      return;
    }
    findBox.style.display = '';
    document.getElementById('sub').textContent = q.length
      ? `${st.activeCount} in line${st.priorityCount ? ` · ${st.priorityCount} priority` : ''}`
      : 'Queue is empty right now.';
    const me = (findBox.value || '').toLowerCase();
    if(!q.length){ el.innerHTML = '<div class="empty">No orders in the queue yet.</div>'; return; }
    el.innerHTML = q.map(e=>{
      const mine = me && e.buyer.toLowerCase().includes(me);
      const cls = 'row'+(e.isPriority?' priority':'')+(mine?' me':'');
      return `<div class="${cls}">
        <div class="pos">${e.position}</div>
        <div class="name">${esc(e.buyer)}</div>
        ${e.isPriority?'<span class="tag">PRIORITY</span>':''}
      </div>`;
    }).join('');
  }
  render();
</script>
</body>
</html>
